<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wellgraph onboarding</title>
<style>
  :root { --bg: #f4f6f8; --panel: #ffffff; --ink: #17202b; --muted: #5a6675; --line: #dbe1e8;
          --accent: #0b6e99; --soft: #eef2f6; --ok: #2e7d5b; --warn: #b4690e; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151b; --panel: #1a2028; --ink: #e7ecf2; --muted: #9aa6b4; --line: #2c3541;
            --accent: #5bb8de; --soft: #222a34; --ok: #6fcf9f; --warn: #e3a857; --bad: #f08a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.running { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
  .dot.stalled { background: var(--warn); } .dot.done { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 14px; }
  .hero { display: grid; grid-template-columns: 190px 1fr; gap: 22px; align-items: center; }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
  .ring { position: relative; width: 180px; height: 180px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; }
  .ring .track { stroke: var(--soft); }
  .ring .value { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
  .ring .label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .pct { font-size: 38px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ring .of { font-size: 12px; color: var(--muted); }
  .stage-name { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stage-title { font-size: 22px; font-weight: 650; margin: 2px 0 6px; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
  .kpi { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
  .kpi .k { font-size: 11.5px; color: var(--muted); }
  .kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .v.warn { color: var(--warn); } .kpi .v.bad { color: var(--bad); }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; }
  .mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid;
          place-content: center; font-size: 12px; color: var(--panel); }
  .step.done .mark { background: var(--ok); border-color: var(--ok); }
  .step.now .mark { border-color: var(--accent); }
  .step.now .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .step .name { font-weight: 550; } .step.todo .name { color: var(--muted); font-weight: 400; }
  .step .meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .8s ease; }
  .step.done .bar i { background: var(--ok); }
  .cov { display: grid; gap: 12px; }
  .covrow { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; align-items: center; }
  @media (max-width: 640px) { .covrow { grid-template-columns: 1fr; } }
  .covrow .what { font-weight: 550; } .covrow .what small { display: block; font-weight: 400; color: var(--muted); }
  .covrow .nums { font-variant-numeric: tabular-nums; }
  .covrow .nums b { font-size: 18px; } .covrow .nums span { color: var(--muted); }
  #chart { width: 100%; height: 150px; display: block; }
  #chart text { fill: var(--muted); font-size: 11px; }
  .foot { margin-top: 12px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>wellgraph onboarding</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
  </header>

  <section class="panel hero" aria-live="polite">
    <div class="ring">
      <svg viewBox="0 0 180 180" width="180" height="180" aria-hidden="true">
        <circle class="track" cx="90" cy="90" r="78"></circle>
        <circle class="value" id="arc" cx="90" cy="90" r="78" stroke-dasharray="490" stroke-dashoffset="490"></circle>
      </svg>
      <div class="label"><div><div class="pct" id="pct">–</div><div class="of" id="of"></div></div></div>
    </div>
    <div>
      <div class="stage-name" id="stageno"></div>
      <div class="stage-title" id="stage">Waiting for a run</div>
      <div class="count" id="count"></div>
      <div class="kpis">
        <div class="kpi"><div class="k">Rate, last minute</div><div class="v" id="rate">–</div></div>
        <div class="kpi"><div class="k">Time left in this stage</div><div class="v" id="left">–</div></div>
        <div class="kpi"><div class="k">Stage finishes at</div><div class="v" id="eta">–</div></div>
        <div class="kpi"><div class="k">Running for</div><div class="v" id="elapsed">–</div></div>
        <div class="kpi"><div class="k">Failed model calls</div><div class="v" id="failed">–</div></div>
        <div class="kpi"><div class="k">Free laptop disk</div><div class="v" id="disk">–</div></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Stages</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="panel">
    <h2>Wells and reports</h2>
    <div class="cov" id="cov"></div>
  </section>

  <section class="panel">
    <h2>Throughput, items per second</h2>
    <svg id="chart" viewBox="0 0 900 150" preserveAspectRatio="none" role="img" aria-label="Throughput over time"></svg>
    <div class="foot" id="foot"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("en-US");
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : m ? `${m} min` : `${s} s`; };
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});

function draw(d) {
  const st = d.state || {}, stages = st.stages || {}, current = st.stage;
  const order = d.order, labels = d.labels;
  const idx = order.indexOf(current), entry = stages[current] || {};
  const finished = current === "done", stale = d.now - (st.updated || d.now);
  const mode = !current ? "idle" : finished ? "done" : (!d.alive || stale > 300) ? "stalled" : "running";
  $("dot").className = "dot " + mode;
  $("status").textContent = {idle: "no run yet", done: `finished at ${clock(st.updated)}`,
    stalled: d.alive ? `no update for ${dur(stale)}` : "pipeline is not running",
    running: `running · updated ${clock(d.now)}`}[mode];

  const done = entry.done || 0, total = entry.total || 0;
  const pct = finished ? 100 : total ? 100 * done / total : 0;
  $("arc").style.strokeDashoffset = 490 * (1 - pct / 100);
  $("pct").textContent = current ? pct.toFixed(pct < 10 && !finished ? 1 : 0) + "%" : "–";
  $("of").textContent = finished ? "all stages" : total ? "of this stage" : "";
  $("stageno").textContent = finished ? "Complete" : idx >= 0 ? `Stage ${idx + 1} of ${order.length}` : "";
  $("stage").textContent = finished ? "Run finished" : labels[current] || "Waiting for a run";
  $("count").textContent = total && !finished ? `${fmt(done)} of ${fmt(total)}` : "";

  const rate = d.rate, remaining = total - done;
  $("rate").textContent = !finished && rate > 0 ? rate.toFixed(1) + " /s" : "–";
  $("left").textContent = !finished && rate > 0 && total ? dur(remaining / rate) : "–";
  $("eta").textContent = !finished && rate > 0 && total ? clock(d.now + remaining / rate) : "–";
  $("elapsed").textContent = st.started ? dur((finished ? st.updated : d.now) - st.started) : "–";
  $("failed").textContent = d.failed == null ? "–" : fmt(d.failed);
  $("failed").className = "v" + (d.failed > 0 ? " warn" : "");
  $("disk").textContent = d.free_gb.toFixed(1) + " GB";
  $("disk").className = "v" + (d.free_gb < 0.5 ? " bad" : d.free_gb < 1 ? " warn" : "");

  $("steps").innerHTML = order.map((s, i) => {
    const e = stages[s] || {}, isDone = finished || (idx >= 0 && i < idx), now = s === current && !finished;
    const p = isDone ? 100 : now && e.total ? 100 * e.done / e.total : 0;
    const meta = isDone ? (e.started ? `${e.total ? fmt(e.total) + " · " : ""}${dur(e.updated - e.started)}` : "done")
      : now && e.total ? `${fmt(e.done)} of ${fmt(e.total)}` : now ? "working" : "";
    return `<li class="step ${isDone ? "done" : now ? "now" : "todo"}"><span class="mark">${isDone ? "✓" : ""}</span>
      <span class="name">${labels[s]}</span><span class="meta">${meta}</span>
      <span class="bar"><i style="width:${p}%"></i></span></li>`;
  }).join("");

  const c = d.coverage || {}, tot = c.total;
  const row = (what, sub, v, cls) => { if (!v) return "";
    const p = tot ? 100 * v.reports / tot.reports : 0;  // by report: folder count is not a well count
    const unit = v === tot ? "well folders" : "wells";
    return `<div class="covrow"><div class="what">${what}<small>${sub}</small></div>
      <div><div class="nums"><b>${fmt(v.wells)}</b> ${unit} <span>· ${fmt(v.reports)} reports${tot && v !== tot ? ` · ${p.toFixed(1)}% of all reports` : ""}</span></div>
      <div class="bar"><i style="width:${v === tot ? 100 : p}%;${cls ? "background:var(--" + cls + ")" : ""}"></i></div></div></div>`; };
  $("cov").innerHTML = (row("Served now", "live graph on Azure", c.live, "ok") + row("This run", "being extracted", c.run, "")
    + row("Whole dataset", "on the disk; sidetrack tracks (T2, T3) have their own folder", tot, "line")) || "<span class='count'>no graph found yet</span>";

  const pts = d.history.filter(p => p.rate != null);
  const W = 900, H = 150, top = 12, bottom = 22;
  if (pts.length > 1) {
    const max = Math.max(1, ...pts.map(p => p.rate)) * 1.15, t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    const x = t => 40 + (W - 50) * (t - t0) / Math.max(1, t1 - t0), y = r => H - bottom - (H - top - bottom) * r / max;
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.rate).toFixed(1)}`).join(" ");
    const grid = [0, max / 2, max].map(v => `<line x1="40" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <text x="34" y="${y(v) + 4}" text-anchor="end">${v.toFixed(v < 10 ? 1 : 0)}</text>`).join("");
    $("chart").innerHTML = `${grid}<path d="${line} L${x(t1)},${y(0)} L${x(t0)},${y(0)} Z" fill="var(--accent)" opacity=".12"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <text x="40" y="${H - 5}">${clock(t0)}</text><text x="${W - 10}" y="${H - 5}" text-anchor="end">${clock(t1)}</text>`;
  } else $("chart").innerHTML = `<text x="450" y="80" text-anchor="middle">collecting samples…</text>`;
  $("foot").textContent = d.note || "";
}

async function tick() {
  try { draw(await fetch("/api/progress", {cache: "no-store"}).then(r => r.json())); }
  catch { $("dot").className = "dot stalled"; $("status").textContent = "dashboard server not reachable"; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
