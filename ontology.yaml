# wellgraph ontology: entity types and relationship types of the knowledge graph.
#
# STATUS: draft. Three rings:
#   core     what the graph holds today, built from SODIR FactPages and the end-of-well
#            reports. Each core entity names the table it is stored in
#            (schema.yaml is the column-level contract).
#   observed what the end-of-well reports contain but the graph does not extract yet.
#            Found by reading and profiling 7 sample reports (1,208 pages). "seen_in"
#            counts pages whose text matches keywords for that content, and how many of
#            the 7 reports have any; it is an upper bound on mentions, not a count of
#            records. Extracting any of these needs no new data source.
#   planned  the wider subsurface model from the team's SWM schema proposal (well data,
#            seismic, geology). No data source is connected for these yet; they are
#            listed so both views share one vocabulary and one join point (the wellbore).
#
# Entity status:
#   populated  has rows in the graph
#   defined    table and columns exist, no rows yet
#   observed   present in the reports, not extracted
#   planned    name and meaning only, no data source
#
# osdu_kind is the closest kind in the official OSDU data definitions
# (https://community.opengroup.org/osdu/data/data-definitions). Every kind named here was
# checked to exist at version 1.0.0. For planned entities the fit has not been reviewed
# in detail. "local" means no OSDU kind is used.
#
# tests/test_ontology.py checks this file against the table contract.

version: 1

entities:

  # ----------------------------------------------------------------------------- core
  Well:
    ring: core
    status: populated
    osdu_kind: master-data--Well
    stored_as: column well_name on table wellbore
    source: SODIR FactPages
    description: The origin of a set of wellbores.

  Wellbore:
    ring: core
    status: populated
    osdu_kind: master-data--Wellbore
    table: wellbore
    key: wellbore_id (NPD wellbore id)
    source: SODIR FactPages (exploration, development and other wellbores)
    description: >
      A hole in the ground. Carries operator, field, drilling facility, dates, total
      depth, water depth and coordinates. The join point for everything else.

  GeologicalFormation:
    ring: core
    status: populated
    osdu_kind: reference-data--GeologicalFormation
    table: formation
    source: SODIR lithostratigraphy
    description: >
      Lithostratigraphic unit (group, subgroup, formation, member) with its parent unit.
      Corresponds to "layers" in the SWM proposal, seen along a wellbore.

  HoleSection:
    ring: core
    status: populated
    osdu_kind: master-data--HoleSection
    table: hole_section
    source: SODIR casing and leak-off table
    description: >
      Section of a wellbore of constant diameter, with the casing set in it
      (work-product-component--TubularAssembly) and the leak-off value at its shoe
      (work-product-component--FormationIntegrityTest).

  MudCheck:
    ring: core
    status: populated
    osdu_kind: master-data--FluidsReport
    table: mud_check
    source: SODIR mud table
    description: Mud weight and properties measured at a depth in a wellbore.

  Document:
    ring: core
    status: populated
    osdu_kind: work-product-component--Document
    table: document
    source: Diskos end-of-well reports (Zenodo record 24320092)
    description: One end-of-well / completion report.

  Page:
    ring: core
    status: populated
    osdu_kind: local
    table: page
    source: report JSON
    description: OCR text and summary of one report page. Carries the provenance.

  DrillingEvent:
    ring: core
    status: populated
    osdu_kind: master-data--Risk
    table: event
    source: extracted from report pages by a language model, then depth-joined
    description: >
      Something that went wrong while drilling (lost circulation, kick, stuck pipe, tight
      hole, instability, pack-off, washout, fishing, unplanned sidetrack) with depth
      interval, mud weight, remedy, lesson and a verbatim quote. Each event says how
      exact its depth is (depth_basis: stated, context_point, context_interval, none).

  # ------------------------------------------------------------------------- observed
  # Present in the end-of-well reports, not extracted yet.

  DailyOperationsReport:
    ring: observed
    status: observed
    osdu_kind: master-data--OperationsReport
    seen_in: {pages: 124, reports: 7}
    description: >
      One dated row or page of the daily drilling log: date, depth at report time, mud
      weight and the operations text. Most events without their own depth get their
      context depth from here.
    would_enable: a time-depth curve per wellbore, and a date and exact depth for every event

  ReportSection:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 754, reports: 7}
    description: >
      A headed section of a report, such as '12 1/4" hole: 1630-2926 m'. Carries the hole
      size and interval for the text under it. (seen_in counts pages with a table or
      title layout element.)
    would_enable: hole section for events whose page gives no depth at all

  LeakOffTest:
    ring: observed
    status: observed
    osdu_kind: work-product-component--FormationIntegrityTest
    seen_in: {pages: 98, reports: 7}
    description: >
      Leak-off or formation integrity test at a casing shoe, with depth and equivalent mud
      weight. SODIR gives one value per casing; reports give the test itself.
    would_enable: the drilling window (mud weight between pore pressure and leak-off) per section

  PorePressureProfile:
    ring: observed
    status: observed
    osdu_kind: work-product-component--PPFGDataset
    seen_in: {pages: 72, reports: 6}
    description: Pore pressure estimates or measurements by depth interval.
    would_enable: comparing the mud weight at an event with the pore pressure at that depth

  BhaRun:
    ring: observed
    status: observed
    osdu_kind: master-data--BHARun
    seen_in: {pages: 148, reports: 7}
    description: A bottom hole assembly run, with its components and interval drilled.
    would_enable: linking stuck pipe and tight hole to the assembly in the hole

  BitRun:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 68, reports: 7}
    description: >
      One row of the bit record: bit size and type, depth in and out, hours, dull grade.
      OSDU carries this as BitRecord inside master-data--OperationsReport.
    would_enable: rate of penetration and bit performance per formation across wells

  CementJob:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 103, reports: 7}
    description: >
      Cementing of a casing string: slurry, volumes, returns. Several loss events occur
      during cement jobs. OSDU has master-data--PlannedCementJob for the plan only.
    would_enable: separating losses while cementing from losses while drilling

  DirectionalSurvey:
    ring: observed
    status: observed
    osdu_kind: work-product-component--WellboreTrajectory
    seen_in: {pages: 154, reports: 7}
    description: Survey stations (measured depth, inclination, azimuth) along the wellbore.
    would_enable: converting between measured and true vertical depth, so TVD events can be joined

  Core:
    ring: observed
    status: observed
    osdu_kind: master-data--Coring
    seen_in: {pages: 121, reports: 6}
    description: A cored interval with recovery and a core description.
    would_enable: rock descriptions by depth; calibration for the planned petrophysical model

  LoggingRun:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 112, reports: 7}
    description: >
      A wireline or LWD logging run: tools, interval logged, problems. The curves
      themselves would be work-product-component--WellLog (planned ring).
    would_enable: knowing which intervals have logs, and logging-tool sticking events

  WellTest:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 82, reports: 6}
    description: Drill stem or production test of an interval, with rates and pressures.
    would_enable: flow results by formation, alongside the planned production data

  LithologyDescription:
    ring: observed
    status: observed
    osdu_kind: work-product-component--WellboreIntervalSet
    seen_in: {pages: 332, reports: 7}
    description: Cuttings and wellsite sample descriptions by depth interval.
    would_enable: lithology at an event depth, finer than formation tops

  LessonLearned:
    ring: observed
    status: observed
    osdu_kind: master-data--Risk
    seen_in: {pages: 84, reports: 5}
    description: >
      A lesson or recommendation the report draws, often in its own section. Today only
      a lesson stated next to an event is kept, as the column event.lesson. In OSDU this
      is a Risk with RiskType 'lessons learned'.
    would_enable: recommendations for the next well, searchable by section and formation

  TimeBreakdown:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 82, reports: 7}
    description: >
      Hours per activity or per kind of lost time. Rows of these tables are deliberately
      not extracted as events.
    would_enable: the time cost of each event type per well

  ShallowGasAssessment:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 46, reports: 6}
    description: Site-survey prediction of shallow gas and what was observed while drilling.
    would_enable: shallow hazard lookup around a planned location

  PetrophysicalEvaluation:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 49, reports: 7}
    description: >
      Log-analysis results per interval: net pay, average porosity, water saturation,
      net-to-gross. No OSDU kind confirmed.
    would_enable: reservoir quality by formation across wells; real values for the planned petrophysical model

  HydrocarbonShow:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 219, reports: 6}
    description: >
      Gas readings and shows while drilling: total and peak gas, chromatograph components
      (C1 to C4), fluorescence. No OSDU kind confirmed.
    would_enable: where hydrocarbons and gas peaks were seen, by depth; context for kicks

  SampleProgramme:
    ring: observed
    status: observed
    osdu_kind: master-data--Sample
    seen_in: {pages: 61, reports: 5}
    description: Which cuttings, sidewall cores and fluid samples were taken at which depths, and where they went.
    would_enable: finding physical samples for an interval

  MaterialConsumption:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 31, reports: 6}
    description: Mud products used and their cost per hole section.
    would_enable: mud cost per section, and LCM volumes as a cross-check on loss events

  WellheadAndCompletionEquipment:
    ring: observed
    status: observed
    osdu_kind: local
    seen_in: {pages: 105, reports: 7}
    description: Wellhead, tree and completion string components, often as schematics.
    would_enable: the as-built completion of development wells

  # -------------------------------------------------------------------------- planned
  # From the SWM schema proposal. Names in "proposal_name" are the proposal's own.

  WellLog:
    ring: planned
    status: planned
    domain: well
    proposal_name: welllog
    osdu_kind: work-product-component--WellLog
    description: Log curves measured along a wellbore.

  ProductionData:
    ring: planned
    status: planned
    domain: well
    proposal_name: production_data
    osdu_kind: work-product-component--ProductionValues
    description: Produced volumes over time for a well.

  InjectionData:
    ring: planned
    status: planned
    domain: well
    proposal_name: injection_data
    osdu_kind: work-product-component--ProductionValues
    description: Injected volumes over time for a well.

  WellSchedule:
    ring: planned
    status: planned
    domain: well
    proposal_name: well_schedule
    osdu_kind: local
    description: Planned operating schedule of a well. No OSDU kind identified.

  Seismic2D:
    ring: planned
    status: planned
    domain: seismic
    proposal_name: 2dseismic
    osdu_kind: master-data--Seismic2DInterpretationSet
    description: 2D seismic lines.

  Seismic3D:
    ring: planned
    status: planned
    domain: seismic
    proposal_name: 3dseismic
    osdu_kind: master-data--Seismic3DInterpretationSet
    description: 3D seismic volume.

  Seismic4DVintage:
    ring: planned
    status: planned
    domain: seismic
    proposal_name: 4dseismic / 4dseismic_vintages
    osdu_kind: master-data--SeismicAcquisitionSurvey
    description: >
      One acquisition in a time-lapse (4D) series. A 4D dataset is a set of vintages over
      the same area.

  SeismicAttribute:
    ring: planned
    status: planned
    domain: seismic
    proposal_name: seismic_attributes
    osdu_kind: work-product-component--SeismicTraceData
    attribute_types: [acoustic_impedance, vp_vs, dip, azimuth]
    description: >
      Attribute volume derived from seismic. The attribute type is a property of the
      volume (reference-data--SeismicAttributeType), not an entity of its own.

  Layer:
    ring: planned
    status: planned
    domain: geology
    proposal_name: layers
    osdu_kind: work-product-component--StratigraphicUnitInterpretation
    description: >
      Layer bounded by horizons. In the core ring the same thing is seen along wellbores
      as GeologicalFormation plus the PENETRATES relationship.

  Horizon:
    ring: planned
    status: planned
    domain: geology
    proposal_name: horizons
    osdu_kind: work-product-component--HorizonInterpretation
    approximation: horizontal plane
    description: Surface separating two layers.

  Fault:
    ring: planned
    status: planned
    domain: geology
    proposal_name: faults
    osdu_kind: work-product-component--FaultInterpretation
    approximation: vertical plane
    description: Fault surface.

  Boundary:
    ring: planned
    status: planned
    domain: geology
    proposal_name: boundary
    osdu_kind: work-product-component--GeobodyBoundaryInterpretation
    approximation: vertical plane
    description: Boundary between regions that is not a fault.

  Region:
    ring: planned
    status: planned
    domain: geology
    proposal_name: regions
    osdu_kind: work-product-component--ReservoirCompartmentInterpretation
    description: >
      Zone within a layer delimited by faults or boundaries. Regions in the same layer
      share one petrophysical model.

  PetrophysicalModel:
    ring: planned
    status: planned
    domain: geology
    proposal_name: petrophysical_model
    osdu_kind: work-product-component--RockFluidUnitInterpretation
    properties: [porosity, permeability, relative_permeability, capillary_pressure, wettability]
    description: >
      Rock and fluid properties of a region. PORO, PERM, RELPERM, CAPPRESS and
      Wettability are properties of the model, not entities.

  Grid3D:
    ring: planned
    status: planned
    domain: geology
    proposal_name: 3dgrids
    osdu_kind: work-product-component--IjkGridRepresentation
    cell_properties: [water_saturation, oil_saturation]
    description: >
      Regular 3D grid implementing the layers and regions. Water saturation (sw) and oil
      saturation (s_oil) are cell properties of the grid
      (work-product-component--GenericProperty), not entities. Oil fields only.

relationships:

  # ----------------------------------------------------------------------------- core
  BELONGS_TO: {from: Wellbore, to: Well, ring: core, stored_as: wellbore.well_name}
  PENETRATES:
    from: Wellbore
    to: GeologicalFormation
    ring: core
    table: formation_top
    properties: [top_md, base_md]
    osdu_kind: work-product-component--WellboreMarkerSet
  PART_OF: {from: GeologicalFormation, to: GeologicalFormation, ring: core, stored_as: formation.parent}
  SECTION_OF: {from: HoleSection, to: Wellbore, ring: core, stored_as: hole_section.wellbore_id}
  MEASURED_IN: {from: MudCheck, to: Wellbore, ring: core, stored_as: mud_check.wellbore_id}
  DESCRIBES: {from: Document, to: Wellbore, ring: core, stored_as: document.wellbore_id}
  PAGE_OF: {from: Page, to: Document, ring: core, stored_as: page.document_id}
  OCCURRED_IN: {from: DrillingEvent, to: Wellbore, ring: core, stored_as: event.wellbore_id}
  IN_SECTION:
    from: DrillingEvent
    to: HoleSection
    ring: core
    stored_as: event.hole_diameter_in
    derived: >
      depth join against hole_section (measured depth only), using the event's stated
      depth or else its context depth; see event.depth_basis for how exact it is
  IN_FORMATION:
    from: DrillingEvent
    to: GeologicalFormation
    ring: core
    stored_as: event.formations
    derived: >
      depth join against formation_top (measured depth only); exact when
      event.depth_basis is stated, approximate for context depths
  EVIDENCED_BY:
    from: DrillingEvent
    to: Page
    ring: core
    stored_as: event.document_id + event.page_no
    properties: [text_span, confidence]

  # ------------------------------------------------------------------------- observed
  REPORTS_ON: {from: DailyOperationsReport, to: Wellbore, ring: observed}
  REPORTED_IN: {from: DrillingEvent, to: DailyOperationsReport, ring: observed}
  SECTION_OF_DOCUMENT: {from: ReportSection, to: Document, ring: observed}
  COVERS: {from: ReportSection, to: HoleSection, ring: observed}
  TESTED_AT: {from: LeakOffTest, to: HoleSection, ring: observed}
  PRESSURE_IN: {from: PorePressureProfile, to: Wellbore, ring: observed}
  RUN_IN: {from: BhaRun, to: HoleSection, ring: observed}
  DRILLED: {from: BitRun, to: HoleSection, ring: observed}
  CEMENTS: {from: CementJob, to: HoleSection, ring: observed}
  DURING: {from: DrillingEvent, to: CementJob, ring: observed}
  SURVEYS: {from: DirectionalSurvey, to: Wellbore, ring: observed}
  CUT_IN: {from: Core, to: GeologicalFormation, ring: observed}
  LOGS: {from: LoggingRun, to: HoleSection, ring: observed}
  TESTS: {from: WellTest, to: GeologicalFormation, ring: observed}
  DESCRIBES_INTERVAL: {from: LithologyDescription, to: Wellbore, ring: observed}
  DRAWN_FROM: {from: LessonLearned, to: DrillingEvent, ring: observed}
  TIME_SPENT_IN: {from: TimeBreakdown, to: Wellbore, ring: observed}
  ASSESSES: {from: ShallowGasAssessment, to: Wellbore, ring: observed}
  EVALUATES: {from: PetrophysicalEvaluation, to: GeologicalFormation, ring: observed}
  SHOW_IN: {from: HydrocarbonShow, to: Wellbore, ring: observed}
  SAMPLED_FROM: {from: SampleProgramme, to: Wellbore, ring: observed}
  CONSUMED_IN: {from: MaterialConsumption, to: HoleSection, ring: observed}
  INSTALLED_IN: {from: WellheadAndCompletionEquipment, to: Wellbore, ring: observed}
  # links from the observed ring to the planned ring
  MEASURES: {from: PetrophysicalEvaluation, to: PetrophysicalModel, ring: observed, note: link to the planned ring}
  ACQUIRES: {from: LoggingRun, to: WellLog, ring: observed, note: link to the planned ring}
  CALIBRATES: {from: Core, to: PetrophysicalModel, ring: observed, note: link to the planned ring}

  # -------------------------------------------------------------------------- planned
  LOGGED_IN: {from: WellLog, to: Wellbore, ring: planned}
  PRODUCED_FROM: {from: ProductionData, to: Well, ring: planned}
  INJECTED_INTO: {from: InjectionData, to: Well, ring: planned}
  SCHEDULED_FOR: {from: WellSchedule, to: Well, ring: planned}
  TIED_TO: {from: Seismic2D, to: Wellbore, ring: planned, note: seismic-to-well tie}
  VINTAGE_OF: {from: Seismic4DVintage, to: Seismic3D, ring: planned}
  DERIVED_FROM: {from: SeismicAttribute, to: Seismic3D, ring: planned}
  BOUNDED_BY: {from: Layer, to: Horizon, ring: planned}
  CORRELATES_WITH: {from: Layer, to: GeologicalFormation, ring: planned, note: link between the two rings}
  WITHIN: {from: Region, to: Layer, ring: planned}
  DELIMITED_BY_FAULT: {from: Region, to: Fault, ring: planned}
  DELIMITED_BY_BOUNDARY: {from: Region, to: Boundary, ring: planned}
  HAS_MODEL: {from: Region, to: PetrophysicalModel, ring: planned}
  DISCRETISES: {from: Grid3D, to: Layer, ring: planned}
  INTERSECTS: {from: Wellbore, to: Region, ring: planned, note: link between the two rings}
