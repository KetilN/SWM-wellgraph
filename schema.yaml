# wellgraph data schema: how the knowledge graph is stored.
#
# The published graph is a folder of Parquet files, one per table, named <table>.parquet.
# This file is the single source of truth for those tables: the graph build writes them
# in this shape and the MCP server refuses a file that lacks a listed column.
# src/wellgraph/graph/schema.py loads this file; do not repeat column lists in code.
#
# How it relates to ontology.yaml:
#   ontology.yaml  WHAT exists: entity and relationship types, meaning, OSDU kind
#   schema.yaml    HOW it is stored: tables, columns, types, units, keys
#
# Column types are DuckDB / Parquet types. Units: depths in metres, densities in specific
# gravity (sg), diameters in inches, coordinates in decimal degrees.
#
# tables        read by the MCP server. A missing file is treated as an empty table.
# extra_tables  built and published, not yet read by the server.

version: 1

tables:

  wellbore:
    entity: Wellbore
    source: SODIR FactPages wellbore tables
    key: [wellbore_id]
    columns:
      wellbore_id: {type: BIGINT, description: NPD wellbore id (wlbNpdidWellbore)}
      name: {type: VARCHAR, description: "SODIR wellbore name, e.g. 15/9-19 A"}
      well_name: {type: VARCHAR, description: Name of the well the wellbore belongs to}
      wellbore_type: {type: VARCHAR, description: "EXPLORATION, DEVELOPMENT or OTHER (shallow, soil, scientific)"}
      purpose: {type: VARCHAR, description: "As written by SODIR, e.g. WILDCAT, APPRAISAL, PRODUCTION"}
      operator: {type: VARCHAR, description: Drilling operator}
      field: {type: VARCHAR, description: Field name}
      drilling_facility: {type: VARCHAR, description: Rig or platform that drilled it}
      entry_date: {type: DATE, description: Spud date}
      completion_date: {type: DATE, description: Date drilling was completed}
      total_depth_md: {type: DOUBLE, unit: m, description: Total depth, measured depth}
      water_depth: {type: DOUBLE, unit: m, description: Water depth at the location}
      lat: {type: DOUBLE, unit: degrees, description: Latitude, decimal degrees}
      lon: {type: DOUBLE, unit: degrees, description: Longitude, decimal degrees}
      factpage_url: {type: VARCHAR, description: SODIR FactPages link}

  formation_top:
    relationship: PENETRATES
    source: SODIR wellbore formation tops
    key: [wellbore_id, formation, top_md]
    columns:
      wellbore_id: {type: BIGINT, description: NPD wellbore id}
      formation: {type: VARCHAR, description: "SODIR unit name, e.g. SHETLAND GP"}
      level: {type: VARCHAR, description: "GROUP, SUBGROUP, FORMATION or MEMBER"}
      parent: {type: VARCHAR, description: Name of the parent unit}
      top_md: {type: DOUBLE, unit: m, description: Top of the unit, measured depth}
      base_md: {type: DOUBLE, unit: m, description: Base of the unit, measured depth}

  hole_section:
    entity: HoleSection
    source: SODIR casing and leak-off table
    key: [wellbore_id, base_md]
    columns:
      wellbore_id: {type: BIGINT, description: NPD wellbore id}
      hole_diameter_in: {type: DOUBLE, unit: in, description: Hole diameter}
      base_md: {type: DOUBLE, unit: m, description: Depth the section was drilled to; null when SODIR has no value}
      casing_type: {type: VARCHAR, description: "As written by SODIR, e.g. CONDUCTOR, SURF.COND., INTERM., LINER"}
      casing_diameter_in: {type: DOUBLE, unit: in, description: Casing outer diameter}
      casing_depth_md: {type: DOUBLE, unit: m, description: Casing shoe depth}
      lot_mud_density_sg: {type: DOUBLE, unit: sg, description: Leak-off / formation integrity test value at the shoe}

  document:
    entity: Document
    source: Diskos end-of-well reports (report JSON metadata) and the Diskos metadata CSV published with them
    key: [document_id]
    columns:
      document_id: {type: VARCHAR, description: Diskos wellbore file id}
      wellbore_id: {type: BIGINT, description: NPD wellbore id, resolved from the report's wellbore name}
      title: {type: VARCHAR, description: Report title}
      relative_path: {type: VARCHAR, description: Path of the PDF inside the Zenodo archive}
      n_pages: {type: INTEGER, description: Number of pages}
      report_type: {type: VARCHAR, description: "Diskos info item type, e.g. COMPLETION_REPORT, WELLBORE_DOCUMENTS (metadata CSV)"}
      description: {type: VARCHAR, description: Diskos description of the report (metadata CSV)}
      delivery_company: {type: VARCHAR, description: Company that delivered the report to Diskos (metadata CSV)}
      release_date: {type: DATE, description: Date the report became public (metadata CSV)}
      created_date: {type: DATE, description: Date the PDF was registered in Diskos (metadata CSV)}
      data_collection: {type: VARCHAR, description: "Diskos data collection of the PDF, e.g. DISKOS SCANNED COMPLETION REPORTS"}
      pdf_size_mb: {type: DOUBLE, description: Size of the PDF in megabytes (metadata CSV)}
      diskos_item_id: {type: VARCHAR, description: DISKOS info item id of the PDF; empty where the CSV value is not a plain number}
      quality_remark: {type: VARCHAR, description: Quality statement for the OCR text of the report (share of reliable / acceptable / uncertain pages)}

  page:
    entity: Page
    source: report JSON pages
    key: [document_id, page_no]
    columns:
      document_id: {type: VARCHAR, description: Document the page belongs to}
      page_no: {type: INTEGER, description: "Page index, 0-based as in the report JSON"}
      text: {type: VARCHAR, description: OCR text of the page as markdown}
      summary: {type: VARCHAR, description: Machine-written summary of the page}
      quality: {type: VARCHAR, description: "Reliable, Acceptable, Uncertain or Figure-dominated"}

  event:
    entity: DrillingEvent
    source: extracted from report pages by a language model, then depth-joined
    key: [event_id]
    columns:
      event_id: {type: VARCHAR, description: Stable id derived from document, page, type and depths}
      wellbore_id: {type: BIGINT, description: NPD wellbore id}
      event_type: {type: VARCHAR, description: One of event_types}
      top_md: {type: DOUBLE, unit: m, description: "Top of the affected interval, only when the report states the depth for the event itself (see depth_ref, depth_basis)"}
      base_md: {type: DOUBLE, unit: m, description: Base of the affected interval; equal to top_md for a single depth}
      mud_weight_sg: {type: DOUBLE, unit: sg, description: "Mud weight in specific gravity: the report's value converted, or filled from the SODIR mud table (see mud_weight_source)"}
      hole_diameter_in: {type: DOUBLE, unit: in, description: "From a depth join against hole_section, using the stated depth or else the context depth; when there is no depth, the hole size the page states for the section; null for TVD depths"}
      formations: {type: "VARCHAR[]", description: "Every unit, any level, containing the depth or overlapping the interval; from a depth join against formation_top. Approximate unless depth_basis is stated"}
      description: {type: VARCHAR, description: What happened}
      remedy: {type: VARCHAR, description: What was done about it}
      lesson: {type: VARCHAR, description: Lesson learned, when the report states one}
      document_id: {type: VARCHAR, description: Source report}
      page_no: {type: INTEGER, description: "Source page, 0-based"}
      text_span: {type: VARCHAR, description: Verbatim quote from the page}
      confidence: {type: DOUBLE, description: Extraction confidence, 0 to 1}
      depth_ref: {type: VARCHAR, description: One of depth_refs}
      mud_weight_raw: {type: VARCHAR, description: "Mud weight as written in the report, e.g. 10.5 ppg"}
      mud_weight_kind: {type: VARCHAR, description: One of mud_weight_kinds}
      mud_weight_source: {type: VARCHAR, description: "One of mud_weight_sources; null when there is no mud weight"}
      depth_basis: {type: VARCHAR, description: One of depth_bases; says how far top_md / base_md and the depth joins can be trusted}
      context_top_md: {type: DOUBLE, unit: m, description: "Top of the depth context the page gives around the event (preceding sentence, daily-report row or section interval); null when the event has its own stated depth or the page gives none"}
      context_base_md: {type: DOUBLE, unit: m, description: Base of the depth context; equal to context_top_md for a single depth}

extra_tables:

  mud_check:
    entity: MudCheck
    source: SODIR wellbore mud table
    columns:
      wellbore_id: {type: BIGINT, description: NPD wellbore id}
      md: {type: DOUBLE, unit: m, description: Measured depth of the check}
      mud_weight_sg: {type: DOUBLE, unit: sg, description: Mud weight}
      viscosity_mpas: {type: DOUBLE, description: "Viscosity; unit (mPa.s) not confirmed against SODIR"}
      yield_point_pa: {type: DOUBLE, description: "Yield point; unit (Pa) not confirmed against SODIR"}
      mud_type: {type: VARCHAR, description: Free text as written by SODIR}
      date_measured: {type: DATE, description: Date of the measurement}

  formation:
    entity: GeologicalFormation
    source: SODIR lithostratigraphy overview
    key: [formation_id]
    columns:
      formation_id: {type: BIGINT, description: NPD lithostratigraphic unit id}
      name: {type: VARCHAR, description: "Unit name, same spelling as formation_top.formation"}
      level: {type: VARCHAR, description: "GROUP, SUBGROUP, FORMATION or MEMBER"}
      parent: {type: VARCHAR, description: Name of the parent unit}
      parent_id: {type: BIGINT, description: Id of the parent unit}
      factpage_url: {type: VARCHAR, description: SODIR FactPages link}

  daily_report:
    entity: DailyOperationsReport
    source: daily drilling report tables in the report pages, parsed without a model
    key: [document_id, page_no, row_index]
    columns:
      wellbore_id: {type: BIGINT, description: NPD wellbore id}
      document_id: {type: VARCHAR, description: Source report}
      page_no: {type: INTEGER, description: "Source page, 0-based"}
      row_index: {type: INTEGER, description: Position of the row on the page}
      report_date: {type: DATE, description: Date of the report row}
      depth_md: {type: DOUBLE, unit: m, description: "Depth at report time; in some layouts this is bit depth per activity, not hole depth"}
      start_depth_md: {type: DOUBLE, unit: m, description: Depth at the start of the day, when the layout gives one}
      mud_weight_raw: {type: VARCHAR, description: Mud weight as written, when the table has that column}
      mud_weight_sg: {type: DOUBLE, unit: sg, description: Mud weight converted to specific gravity}
      operations: {type: VARCHAR, description: Operations text of the row}

  core_sample:
    entity: CoreSample
    source: "RealPore core data, Zenodo record 4723018 (© GeoProvider https://geoprovider.no/, CC BY 4.0)"
    key: [sample_id]
    columns:
      sample_id: {type: VARCHAR, description: "Stable id: rp2- followed by the row number in the RealPore v2.0 sheet"}
      wellbore_id: {type: BIGINT, description: NPD wellbore id (the NPDID column of the source)}
      depth_md: {type: DOUBLE, unit: m, description: Sample depth, measured depth}
      porosity_pct: {type: DOUBLE, unit: "%", description: "Porosity; values outside 0-60 are dropped"}
      porosity_method: {type: VARCHAR, description: "Which source column the porosity came from: best_available, helium, plug_horizontal, plug_vertical, fluid_summation, sum"}
      kh_md: {type: DOUBLE, unit: mD, description: "Horizontal permeability in millidarcy; non-positive values are dropped"}
      kh_method: {type: VARCHAR, description: "klinkenberg, air, nitrogen, gas or unspecified; the first available in that order"}
      kv_md: {type: DOUBLE, unit: mD, description: Vertical permeability in millidarcy}
      kv_method: {type: VARCHAR, description: "klinkenberg, air, nitrogen, gas or unspecified"}
      grain_density_gcc: {type: DOUBLE, unit: g/cm3, description: "Grain density; values outside 1.5-4.0 are dropped"}
      water_saturation_pct: {type: DOUBLE, unit: "%", description: Pore saturation, water}
      oil_saturation_pct: {type: DOUBLE, unit: "%", description: Pore saturation, oil}
      lithology: {type: VARCHAR, description: "Cleaned rock type, 12 classes (sandstone, siltstone, limestone, claystone, chalk ...)"}
      lithology_detail: {type: VARCHAR, description: "Detailed rock type, about 70 classes (sandstone calcareous, sandstone silty ...)"}
      grain_size: {type: VARCHAR, description: Grain size as transcribed}
      sorting: {type: VARCHAR, description: Sorting as transcribed}
      cement: {type: VARCHAR, description: Cementation or consolidation as transcribed}
      description: {type: VARCHAR, description: Original core plug description}
      formation: {type: VARCHAR, description: "SODIR formation-level unit containing the depth; from a depth join against formation_top"}
      group_name: {type: VARCHAR, description: SODIR group containing the depth}
      source_file: {type: VARCHAR, description: Source file name recorded in RealPore}

  poro_perm_fit:
    entity: PetrophysicalModel
    source: fitted from core_sample
    key: [formation, lithology]
    columns:
      formation: {type: VARCHAR, description: SODIR formation}
      lithology: {type: VARCHAR, description: "Cleaned rock type, or all"}
      samples: {type: INTEGER, description: Paired porosity and horizontal permeability samples used}
      wellbores: {type: INTEGER, description: Wellbores those samples come from}
      intercept: {type: DOUBLE, description: "a in log10(kh in mD) = a + b * porosity in %"}
      slope: {type: DOUBLE, description: "b in log10(kh in mD) = a + b * porosity in %"}
      r2: {type: DOUBLE, description: Coefficient of determination of the fit}
      residual_sd: {type: DOUBLE, description: Standard deviation of the residuals in log10 units}
      porosity_p10: {type: DOUBLE, unit: "%", description: 10th percentile of porosity in the samples}
      porosity_p50: {type: DOUBLE, unit: "%", description: Median porosity}
      porosity_p90: {type: DOUBLE, unit: "%", description: 90th percentile of porosity}
      kh_p50: {type: DOUBLE, unit: mD, description: Median horizontal permeability}

enums:

  event_types:
    lost_circulation: Mud lost to the formation
    kick: Influx of formation fluid into the well
    stuck_pipe: String stuck in the hole
    tight_hole: Overpull, drag or reaming needed to pass a spot
    wellbore_instability: Cavings, sloughing or hole collapse
    pack_off: Hole packing off around the string (not the wellhead pack-off seal)
    washout: Enlarged hole or washed-out string
    fishing: Fishing job, twist-off or equipment lost in hole
    sidetrack: Unplanned sidetrack forced by a hole problem
    other: A drilling problem that fits none of the above

  depth_refs:
    MD: Stated as measured depth
    TVD: Stated as true vertical depth; not joined against measured-depth tables
    TVDSS: Stated as true vertical depth subsea; not joined against measured-depth tables
    ASSUMED_MD: No reference written in the report; treated as measured depth

  mud_weight_sources:
    report: Stated in the report for the event
    sodir_mud_table: Nearest measurement in the SODIR mud table for the wellbore, within 300 m of the event depth

  depth_bases:
    stated: The report gives the depth for the event itself, in the same sentence or table row
    context_point: Depth taken from the surrounding narrative or the daily-report row; the event is at or near it
    context_interval: Only the interval being drilled or described is known; the event is somewhere inside it
    none: The page gives no usable depth

  mud_weight_kinds:
    mud_in_hole: Static mud weight in use when the event happened
    ecd: Equivalent circulating density
    unknown: The report does not say

